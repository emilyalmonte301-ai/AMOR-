<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Para mi persona especial ❤️</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="historia">

        <!-- Estrellas -->
        <div class="estrellas"></div>

        <!-- Luna -->
        <div class="luna"></div>

        <!-- Corazones -->
        <div class="corazones"></div>

        <!-- Contenido principal -->
        <section class="escena">

            <p class="pequeno">
                Para alguien muy especial...
            </p>

            <h1 id="titulo">
                ❤️
            </h1>

            <p id="frase" class="frase">
                Tengo algo que quiero decirte...
            </p>

            <button id="boton">
                Comenzar ❤️
            </button>

        </section>

        <!-- Mensaje final -->
        <section id="final" class="mensaje-final">

            <div class="flores">
                 🚗
            </div>

            <h2>
                Feliz Día de los<br>
                  Hot Wheels ❤️
            </h2>

            <p>
                Gracias por ser una persona tan especial
                en mi vida.
            </p>

            <p class="firma">
                TE AMO ❤️
            </p>

        </section>

    </main>


    <script>

        const frases = [

            "Desde que llegaste a mi vida, muchas cosas se sienten diferentes. ❤️",

            "Me encanta tenerte en mi vida y poder compartir momentos contigo. 🥰",

            "Eres la unica persona que hace que los días normales se vuelvan especiales. ✨",

            "Gracias por cada sonrisa, cada conversación y cada momento que hemos compartido. ❤️",

            "Quiero que nunca olvides lo importante y especial que eres para mí. 💙",

            "No necesito grandes cosas para ser feliz... solo necesito tenerte cerca. 🥹",

            "Contigo he aprendido que los pequeños momentos pueden convertirse en los recuerdos más bonitos. 🌙",

            "Y si pudiera elegir nuevamente a alguien para compartir mi vida... te elegiría a ti. ❤️"

        ];


        let posicion = 0;

        const frase = document.getElementById("frase");
        const boton = document.getElementById("boton");
        const titulo = document.getElementById("titulo");
        const final = document.getElementById("final");


        boton.addEventListener("click", function () {

            if (posicion < frases.length) {

                titulo.textContent = "❤️";

                frase.classList.remove("aparecer");

                void frase.offsetWidth;

                frase.textContent = frases[posicion];

                frase.classList.add("aparecer");

                posicion++;

                boton.textContent = "Siguiente ❤️";

            } else {

                document.querySelector(".escena")
                    .classList.add("ocultar");

                final.classList.add("mostrar");

                crearCorazones();

            }

        });


        function crearCorazones() {

            const contenedor =
                document.querySelector(".corazones");

            for (let i = 0; i < 20; i++) {

                const corazon =
                    document.createElement("span");

                corazon.textContent = "❤";

                corazon.style.left =
                    Math.random() * 100 + "%";

                corazon.style.animationDelay =
                    Math.random() * 5 + "s";

                corazon.style.animationDuration =
                    (4 + Math.random() * 4) + "s";

                contenedor.appendChild(corazon);
            }
        }

    </script>

</body>

</html>
